<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>External</title>
  <link rel="stylesheet" href="../style.css" />

  <style>
    #lobster_font {
    font-family: ;
    font-size: 1em; /* Using viewport width for scalable font size */
    text-align: left;
    margin: 0;
    z-index: 1;
    color: lightseagreen;
    font-weight:800;
    }

    .container {
        padding: 10px;
      display: flex;
      align-items: center; /* Vertically center the content */
      justify-content: center; /* Horizontally center the content */
      height: 80vh; 
    }

    .background-image {
      position: absolute;
      display: flex;
      align-items: center; /* Vertically center the content */
      justify-content: center; 
      width: 100%;
      height: 100%;
      object-fit: cover;       
      z-index: 0; /* Set a lower z-index than the text */
    }


  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Gasoek+One&family=Libre+Baskerville&family=Lobster&family=Roboto:ital@1&display=swap" rel="stylesheet">

</head>

</head>
<body>
    
    <footer>
        <!-- Your header content goes here -->
        <div>
          <a href="../showcase/contact.html">Connect with me</a>
        </div>

    </footer>
    <script>
      (function () {
        try {
          var doc = window.parent && window.parent.document;
          if (!doc) return;
          var menu = doc.querySelector('.dropdown-content');
          if (menu && !menu.querySelector('a[href$="tourism_analytics.html"]')) {
            var link = doc.createElement('a');
            var inShowcase = doc.location.pathname.indexOf('/showcase/') !== -1;
            link.href = inShowcase ? 'tourism_analytics.html' : 'showcase/tourism_analytics.html';
            link.textContent = 'Python - Tourism Analytics';
            menu.appendChild(link);
          }
          doc.querySelectorAll('.metric span').forEach(function (el) {
            if (el.textContent.trim().toLowerCase() === 'top 5 market share') {
              el.textContent = 'Top 5 Countries Market Share';
            }
          });
          var dataSources = Array.prototype.find.call(doc.querySelectorAll('h2'), function (el) {
            return el.textContent.trim() === 'Data Sources';
          });
          if (dataSources && !doc.getElementById('reproducible-analysis')) {
            var section = doc.createElement('section');
            section.id = 'reproducible-analysis';
            section.className = 'section story sources';
            section.innerHTML = '<h2>Reproducible Analysis</h2><p>The full Python pipeline is kept as a separate source file so the portfolio page stays readable while reviewers can still inspect the methodology, data pulls, synthetic data assumptions and calculation logic.</p><p><a href="scripts/build_tourism_showcase.py">View Python analysis script</a></p>';
            dataSources.closest('section').parentNode.insertBefore(section, dataSources.closest('section'));
          }
        } catch (err) {}
      })();
    </script>
    
<body>
</html>
