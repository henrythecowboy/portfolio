  <circle cx="333.8" cy="81.5" r="5" fill="#1f77b4"/>
  <text x="333.8" y="71.5" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17202a" text-anchor="middle">2019: 19.1m</text>
  <circle cx="399.3" cy="294.3" r="5" fill="#1f77b4"/>
  <text x="399.3" y="284.3" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17202a" text-anchor="middle">2020: 2.7m</text>
  <circle cx="726.5" cy="110.1" r="5" fill="#1f77b4"/>
