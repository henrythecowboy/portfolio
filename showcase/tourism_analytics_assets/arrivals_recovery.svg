  <text x="36" y="54" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#68737d" text-anchor="start">Annual arrivals remain below the 2019 benchmark, with 2026 shown as Jan-Mar partial data.</text>
  <line x1="72" y1="70" x2="792" y2="70" stroke="#d8dee5" stroke-width="1"/>
  <line x1="72" y1="135" x2="792" y2="135" stroke="#d8dee5" stroke-width="1"/>
